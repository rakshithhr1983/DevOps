apiVersion: v1
kind: ConfigMap
metadata:
  name: zepto-storefront-html
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <title>Zepto 10-Min Grocery Storefront</title>
        <style>
            body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #570080; color: white; margin: 0; padding: 40px 20px; text-align: center; }
            .card { max-width: 600px; margin: 0 auto; background: white; color: #1e293b; border-radius: 16px; padding: 30px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
            h1 { color: #f43f5e; margin-bottom: 8px; }
            .badge { display: inline-block; background: #10b981; color: white; padding: 6px 14px; border-radius: 20px; font-weight: bold; font-size: 14px; margin-bottom: 20px; }
            .status-box { background: #f8fafc; border: 2px dashed #cbd5e1; border-radius: 12px; padding: 20px; margin: 20px 0; text-align: left; }
            .status-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #e2e8f0; }
            .status-item:last-child { border-bottom: none; font-weight: bold; color: #10b981; }
        </style>
    </head>
    <body>
        <div class="card">
            <h1>⚡ Zepto 10-Min Grocery</h1>
            <div class="badge">🚀 Deployed on Kubernetes (Minikube Pod: hello-k8s)</div>
            <p>Welcome to Zepto's storefront and real-time delivery status service!</p>
            <div class="status-box">
                <div class="status-item"><span>Order ID:</span><span>#ZEP-89241</span></div>
                <div class="status-item"><span>Item:</span><span>Organic Milk & Fresh Sourdough</span></div>
                <div class="status-item"><span>Delivery Partner:</span><span>Assigned (Ramesh K.)</span></div>
                <div class="status-item"><span>Estimated Arrival:</span><span>6 mins</span></div>
            </div>
            <p style="color: #64748b; font-size: 13px;">Exercise 1: Kubernetes Getting Started - Hello Pod (Nginx Engine)</p>
        </div>
    </body>
    </html>
